<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AFTERHOURZ DEPT.</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
font-family:'Archivo Black', sans-serif;
overflow:hidden;
}

/* ACCESS SCREEN */

#accessScreen{
position:fixed;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
background:black;
z-index:2;
}

#accessScreen h1{
font-size:4vw;
letter-spacing:6px;
margin-bottom:40px;
}

input{
background:transparent;
border:1px solid white;
color:white;
padding:15px;
width:260px;
text-align:center;
font-size:16px;
letter-spacing:2px;
outline:none;
margin-bottom:20px;
}

button{
padding:12px 30px;
border:none;
background:white;
font-weight:bold;
cursor:pointer;
}

#message{
margin-top:15px;
color:red;
font-size:14px;
letter-spacing:2px;
}

.access-footer{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
color:white;
font-family:"Times New Roman", Times, serif;
font-size:20px;
letter-spacing:2px;
}

/* MAIN PAGE */

#mainPage{
position:fixed;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
opacity:0;
pointer-events:none;
transition:1s ease;
}

/* TEXT */

#mainText{
font-size:6vw;
letter-spacing:6px;
text-align:center;
}

/* IMAGE */

#mainImage{
display:none;
max-width:70%;
max-height:70%;
object-fit:contain;
}

/* COUNTDOWN */

#countdown{
margin-top:20px;
font-size:3vw;
letter-spacing:4px;
}

/* FOOTER */

.footer-text{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
color:white;
font-family:"Oswald", Times, serif;
font-size:20px;
letter-spacing:2px;
}

/* ===== GLITCH EVENT ===== */

#glitchOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
opacity:0;
z-index:9999;
background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,0.05) 0px,
rgba(255,255,255,0.05) 2px,
transparent 2px,
transparent 4px
);
mix-blend-mode:overlay;
}

.glitch-active{
animation:glitchFlash 0.15s infinite;
}

@keyframes glitchFlash{
0%{opacity:0;}
50%{opacity:1;}
100%{opacity:0;}
}

/* ===== GLOBAL LIKE SYSTEM ===== */

#likeSystem{
position:fixed;
bottom:80px;
width:100%;
text-align:center;
color:white;
z-index:5;
}

#likeButton{
padding:12px 30px;
border:none;
background:white;
font-weight:bold;
cursor:pointer;
letter-spacing:2px;
}

#likeCounter{
margin-top:10px;
font-size:20px;
letter-spacing:3px;
}

/* ===== PUZZLE SYSTEM STYLES (GRID FIX - EXACT FIT) ===== */

#puzzleTriggerBtn {
position: fixed;
bottom: 80px;
left: 50%;
transform: translateX(-50%);
width: 60px;
height: 60px;
border-radius: 50%;
border: 1px solid rgba(255, 255, 255, 0.4);
background: rgba(0, 0, 0, 0.6);
backdrop-filter: blur(5px);
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
z-index: 10;
transition: all 0.3s ease;
box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
}

#puzzleTriggerBtn:hover {
background: rgba(255, 255, 255, 0.15);
border-color: #fff;
box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
transform: translateX(-50%) scale(1.08);
}

.inner-square {
width: 22px;
height: 22px;
border: 1px solid white;
transition: transform 0.3s ease;
}

#puzzleTriggerBtn:hover .inner-square {
transform: rotate(45deg);
}

#puzzleModal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100vh;
background: rgba(5, 5, 5, 0.95);
backdrop-filter: blur(10px);
z-index: 100;
flex-direction: column;
justify-content: center;
align-items: center;
}

.close-puzzle {
position: absolute;
top: 30px;
right: 40px;
color: rgba(255, 255, 255, 0.6);
font-size: 32px;
cursor: pointer;
transition: color 0.2s ease, transform 0.2s ease;
font-family: monospace;
}

.close-puzzle:hover {
color: #fff;
transform: scale(1.2);
}

.puzzle-title {
color: #888;
font-size: 11px;
letter-spacing: 4px;
margin-bottom: 25px;
text-transform: uppercase;
font-family: monospace;
opacity: 0.8;
}

/* Layout en Paralelo */
.puzzle-wrapper {
display: flex;
gap: 30px;
align-items: center;
justify-content: center;
flex-wrap: wrap;
}

.puzzle-box {
background: #000;
border: 1px solid #222;
padding: 12px;
position: relative;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.puzzle-box::before {
content: '';
position: absolute;
top: -1px;
left: -1px;
width: 8px;
height: 8px;
border-top: 2px solid #fff;
border-left: 2px solid #fff;
}

.puzzle-box::after {
content: '';
position: absolute;
bottom: -1px;
right: -1px;
width: 8px;
height: 8px;
border-bottom: 2px solid #fff;
border-right: 2px solid #fff;
}

.box-label {
color: #555;
font-size: 10px;
letter-spacing: 2px;
margin-bottom: 10px;
font-family: monospace;
text-transform: uppercase;
}

#puzzleBoard {
width: 310px;
height: 310px;
display: grid;
grid-template-columns: repeat(5, 1fr);
grid-template-rows: repeat(5, 1fr);
gap: 2px;
background: #080808;
border: 1px solid #1a1a1a;
}

#puzzlePieces {
width: 310px;
height: 310px;
display: grid;
grid-template-columns: repeat(5, 1fr);
grid-template-rows: repeat(5, 1fr);
gap: 2px;
background: #080808;
border: 1px solid #1a1a1a;
overflow: hidden;
}

.puzzle-slot {
width: 100%;
height: 100%;
background: rgba(255, 255, 255, 0.02);
border: 1px dashed rgba(255, 255, 255, 0.08);
transition: border-color 0.2s;
}

.puzzle-slot:hover {
border-color: rgba(255, 255, 255, 0.2);
}

.puzzle-piece {
width: 60px;
height: 60px;
background-image: url('puzzle.jpg');
background-size: 300px 300px;
cursor: grab;
user-select: none;
border: 1px solid rgba(255, 255, 255, 0.1);
transition: transform 0.1s ease, border-color 0.2s ease;
}

.puzzle-piece:active {
cursor: grabbing;
transform: scale(1.05);
border-color: #fff;
box-shadow: 0 0 10px rgba(255,255,255,0.3);
}

#revealContainer {
display: none;
animation: fadeIn 0.5s ease-in-out;
}

#revealImage {
max-width: 380px;
max-height: 380px;
border: 1px solid #fff;
box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
object-fit: contain;
}

@keyframes fadeIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}

</style>
</head>

<body>

<div id="accessScreen">
<h1>Compromised Access</h1>

<input type="text" id="codeInput" placeholder="ENTER PASSWORD">
<button onclick="checkCode()">ENTER</button>

<div id="message"></div>

<div class="access-footer"></div>
</div>

<div id="mainPage">

<h1 id="mainText">We'll be back soon...</h1>

<div id="countdown"></div>

<img id="mainImage" src="">

<button id="puzzleTriggerBtn" onclick="openPuzzleModal()">
  <div class="inner-square"></div>
</button>

<div class="footer-text">AFTERHOURZ 2026</div>

</div>

<div id="puzzleModal">
  <span class="close-puzzle" onclick="closePuzzleModal()">&times;</span>
  <div class="puzzle-title">[ DECRYPTION MATRIX v2.5 ]</div>
  
  <div class="puzzle-wrapper" id="puzzleArea">
    <div class="puzzle-box">
      <div class="box-label">// FRAGMENTS (25)</div>
      <div id="puzzlePieces"></div>
    </div>
    
    <div class="puzzle-box">
      <div class="box-label">// RECONSTRUCTION</div>
      <div id="puzzleBoard"></div>
    </div>
  </div>

  <div id="revealContainer">
    <div class="puzzle-box">
      <div class="box-label">// SIGNAL DECODED</div>
      <img id="revealImage" src="reveal.jpg" alt="Decoded Code">
    </div>
  </div>
</div>

<div id="likeSystem">

<button id="likeButton">JOIN THE SIGNAL</button>

<div id="likeCounter">0</div>

</div>

<div id="glitchOverlay"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const ACCESS_CODE = "NUWNDAI25";
const STORAGE_KEY = "afterhourz_access";

/* CAMBIAR TODO AQUI */

const USE_IMAGE = false;
const IMAGE_FILE = "AFTERHOURZ - 2026-04-18T120805.416.png";
const TEXT_MESSAGE = "ITS OVER!";

/* FULLSCREEN IMAGE CONTROL */

const FULLSCREENIMAGE = false;
const FULLSCREEN_FILE = "afterhourzgallery.png";

/* ===== NUEVO SISTEMA VIDEO FULLSCREEN ===== */

const ENABLE_FULLSCREEN_VIDEO = false;
const VIDEO_FILE = "afterhourzvideo.mp4.mp4";

/* ===== NUEVO SISTEMA MUSICA ===== */

const ENABLE_BACKGROUND_MUSIC = true;
const MUSIC_FILE = "milan.mp3.mp3";

/* COUNTDOWN CONTROL */

const ENABLE_COUNTDOWN = false;

const GLOBAL_END_DATE = Date.UTC(2026, 2, 3, 5, 0, 0);

/* EVENTO GLITCH */

const GLITCH_EVENT = false;

/* GLOBAL LIKE SYSTEM */

const ENABLE_LIKE_SYSTEM = false;

/* ------------------- */

function unlockSite(){

const access=document.getElementById("accessScreen");
const main=document.getElementById("mainPage");

access.style.display="none";
main.style.opacity="1";
main.style.pointerEvents="auto";

applyContent();

if(ENABLE_COUNTDOWN){
startCountdown();
}else{
document.getElementById("countdown").style.display="none";
}

if(GLITCH_EVENT){
startGlitchEvent();
}

activateFullscreenImage();
activateFullscreenVideo();
activateBackgroundMusic();

}

function applyContent(){

const text=document.getElementById("mainText");
const image=document.getElementById("mainImage");

if(USE_IMAGE){
text.style.display="none";
image.style.display="block";
image.src=IMAGE_FILE;
}else{
image.style.display="none";
text.style.display="block";
text.textContent=TEXT_MESSAGE;
}

}

/* ===== FULLSCREEN IMAGE SYSTEM ===== */

function activateFullscreenImage(){

if(!FULLSCREENIMAGE) return;

const img=document.createElement("img");

img.src=FULLSCREEN_FILE;

img.style.position="absolute";
img.style.top="0";
img.style.left="0";
img.style.width="100%";
img.style.height="100%";
img.style.objectFit="cover";
img.style.zIndex="-1";
img.style.pointerEvents="none";

document.getElementById("mainPage").appendChild(img);

}

/* ===== VIDEO FULLSCREEN ===== */

function activateFullscreenVideo(){

if(!ENABLE_FULLSCREEN_VIDEO) return;

const video=document.createElement("video");

video.src=VIDEO_FILE;
video.autoplay=true;
video.loop=true;
video.muted=true;
video.playsInline=true;

video.style.position="absolute";
video.style.top="0";
video.style.left="0";
video.style.width="100%";
video.style.height="100%";
video.style.objectFit="cover";
video.style.zIndex="-2";
video.style.pointerEvents="none";

document.getElementById("mainPage").appendChild(video);

}

/* ===== NUEVA FUNCION MUSICA ===== */

function activateBackgroundMusic(){

if(!ENABLE_BACKGROUND_MUSIC) return;

const audio=document.createElement("audio");

audio.src=MUSIC_FILE;
audio.loop=true;
audio.autoplay=true;

audio.style.display="none";

document.body.appendChild(audio);

audio.play().catch(()=>{});

}

function checkCode(){

const input=document.getElementById("codeInput").value;
const message=document.getElementById("message");

if(input===ACCESS_CODE){

localStorage.setItem(STORAGE_KEY,ACCESS_CODE);

const access=document.getElementById("accessScreen");
access.style.transition="1s";
access.style.opacity="0";

setTimeout(()=>{unlockSite();},1000);

}else{
message.textContent="ACCESS DENIED";
}

}

document.getElementById("codeInput")
.addEventListener("keypress",function(e){
if(e.key==="Enter") checkCode();
});

/* COUNTDOWN GLOBAL REAL */

function formatTime(sec){

let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
let s=sec%60;

h=String(h).padStart(2,"0");
m=String(m).padStart(2,"0");
s=String(s).padStart(2,"0");

return h+":"+m+":"+s;

}

function startCountdown(){

const el=document.getElementById("countdown");

setInterval(()=>{

let remaining=Math.floor((GLOBAL_END_DATE-Date.now())/1000);

if(remaining<=0){
el.textContent="00:00:00";
return;
}

el.textContent=formatTime(remaining);

},1000);

}

/* ===== GLITCH SYSTEM ===== */

let glitchInterval;

function randomGlitch(){

if(!GLITCH_EVENT && !puzzleGlitchActive) return;

const overlay=document.getElementById("glitchOverlay");

overlay.classList.add("glitch-active");

document.body.style.transform =
"translate("+(Math.random()*8-4)+"px,"+(Math.random()*8-4)+"px)";

setTimeout(()=>{
overlay.classList.remove("glitch-active");
document.body.style.transform="translate(0,0)";
},120+Math.random()*200);

}

function startGlitchEvent(){

glitchInterval=setInterval(()=>{
randomGlitch();
},2000+Math.random()*4000);

}

/* AUTO LOGIN */

window.onload=function(){

const saved=localStorage.getItem(STORAGE_KEY);

if(saved===ACCESS_CODE){
unlockSite();
}

initPuzzle();

};

/* ===== PUZZLE LOGIC (GRID PERFECT 5x5) ===== */

let puzzleGlitchActive = false;

function openPuzzleModal() {
  document.getElementById("puzzleModal").style.display = "flex";
}

function closePuzzleModal() {
  document.getElementById("puzzleModal").style.display = "none";
}

function initPuzzle() {
  const board = document.getElementById("puzzleBoard");
  const piecesContainer = document.getElementById("puzzlePieces");
  
  board.innerHTML = "";
  piecesContainer.innerHTML = "";

  const cols = 5;
  const rows = 5;
  const total = cols * rows;

  let pieces = [];

  for (let i = 0; i < total; i++) {
    // Crear ranura
    const slot = document.createElement("div");
    slot.classList.add("puzzle-slot");
    slot.dataset.index = i;
    slot.ondragover = (e) => e.preventDefault();
    slot.ondrop = dropPiece;
    board.appendChild(slot);

    // Crear pieza
    const piece = document.createElement("div");
    piece.classList.add("puzzle-piece");
    piece.draggable = true;
    piece.id = "piece-" + i;
    piece.dataset.index = i;

    const col = i % cols;
    const row = Math.floor(i / cols);
    piece.style.backgroundPosition = `-${col * 60}px -${row * 60}px`;

    piece.ondragstart = (e) => {
      e.dataTransfer.setData("text/plain", piece.id);
    };

    pieces.push(piece);
  }

  // Mezclar piezas
  pieces.sort(() => Math.random() - 0.5);
  pieces.forEach(p => piecesContainer.appendChild(p));
  
  piecesContainer.ondragover = (e) => e.preventDefault();
  piecesContainer.ondrop = (e) => {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    const draggedPiece = document.getElementById(id);
    if (draggedPiece) piecesContainer.appendChild(draggedPiece);
  };
}

function dropPiece(e) {
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  const draggedPiece = document.getElementById(id);
  
  if (this.children.length === 0 && draggedPiece) {
    this.appendChild(draggedPiece);
    checkPuzzleCompletion();
  }
}

function checkPuzzleCompletion() {
  const slots = document.querySelectorAll(".puzzle-slot");
  let correct = 0;

  slots.forEach(slot => {
    if (slot.children.length > 0) {
      const piece = slot.children[0];
      if (slot.dataset.index === piece.dataset.index) {
        correct++;
      }
    }
  });

  if (correct === 25) {
    triggerPuzzleSuccess();
  }
}

function triggerPuzzleSuccess() {
  puzzleGlitchActive = true;
  
  let glitchCount = 0;
  const burst = setInterval(() => {
    randomGlitch();
    glitchCount++;
    if (glitchCount > 8) {
      clearInterval(burst);
      puzzleGlitchActive = false;
    }
  }, 100);

  setTimeout(() => {
    document.getElementById("puzzleArea").style.display = "none";
    document.getElementById("revealContainer").style.display = "block";
  }, 600);
}

/* ===== GLOBAL LIKE SYSTEM SCRIPT ===== */

if(ENABLE_LIKE_SYSTEM){

try{

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
databaseURL: "https://afterhourz-database-default-rtdb.firebaseio.com",
projectId: "YOUR_PROJECT",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "ID",
appId: "APP_ID"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();
const likeRef = db.ref("afterhourz_likes");

const likeButton = document.getElementById("likeButton");
const likeCounter = document.getElementById("likeCounter");

likeRef.once("value").then(function(snapshot){

if(snapshot.val() === null){
likeRef.set(0);
}

});

likeRef.on("value", function(snapshot){

likeCounter.textContent = snapshot.val() || 0;

});

likeButton.onclick = function(){

if(localStorage.getItem("afterhourz_liked")) return;

likeRef.transaction(function(current){

return (current || 0) + 1;

});

localStorage.setItem("afterhourz_liked", true);

likeButton.disabled = true;

};

if(localStorage.getItem("afterhourz_liked")){
likeButton.disabled = true;
}

}catch(e){

console.log("LIKE SYSTEM ERROR:", e);

}

}else{

document.getElementById("likeSystem").style.display="none";

}

</script>

</body>
</html>
